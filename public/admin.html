<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SKINVAULT Admin</title><link rel="stylesheet" href="style.css"><style>
.admin{max-width:900px;margin:40px auto;padding:0 20px}.panel{background:#171420;border:1px solid #393047;border-radius:9px;padding:22px;margin:20px 0}.panel input,.panel select{display:block;width:100%;background:#0d0b14;color:white;border:1px solid #40364f;border-radius:5px;padding:11px;margin:5px 0 12px}.panel label{font-size:11px;color:#c9bfd7}.panel button{background:#a77bff;color:#100b1c;border:0;border-radius:5px;padding:10px 15px;font-weight:bold;cursor:pointer;margin:4px}.item{padding:12px;border-bottom:1px solid #393047;display:flex;justify-content:space-between;gap:10px;font-size:12px}.muted{color:#a49aaf;font-size:11px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}@media(max-width:600px){.grid{grid-template-columns:1fr}}
</style></head><body><header class="header"><a class="brand" href="/">SKIN<span class="purple">VAULT</span></a><a href="/" style="margin-left:auto">View store ↗</a></header><main class="admin"><div class="section-kicker">STORE MANAGEMENT</div><h1>Edit your marketplace</h1><p class="muted">Manage products, prices, categories and photos. Changes are saved on the website.</p>
<section class="panel" id="login"><h2>Admin sign in</h2><label>Admin password</label><input id="pw" type="password"><button id="sign">Sign in</button><p id="status" class="muted"></p></section>
<div id="editor" hidden><section class="panel"><h2 id="heading">Add a product</h2><form id="form"><input id="id" type="hidden"><div class="grid"><label>Product name<input id="name" required></label><label>Price (£)<input id="price" type="number" min=".01" step=".01" required></label><label>Category<select id="category"><option>Apparel</option><option>Setup gear</option><option>Accessories</option><option>Art</option></select></label><label>Photo URL<input id="image" placeholder="https://..."></label></div><button>Save product</button><button type="button" id="clear">Clear</button></form><p id="saved" class="muted"></p></section><section class="panel"><h2>Your products</h2><div id="list"></div></section></div></main><script src="admin.js"></script></body></html>
